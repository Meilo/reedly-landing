seo:
  title: "Enregistrement Vocal RDV Client | Reedly"
  description: "Application d'enregistrement vocal pour rendez-vous commerciaux terrain. Un tap pour démarrer, transcription automatique, rapport généré en 2 min."
  keywords: 
    - enregistrement vocal réunion
    - application enregistrement rendez-vous client
    - enregistrement audio commercial terrain
hero:
  eyebrow: "Enregistrement vocal mains libres"
  title: "Pendant ou après le rendez-vous,<br /><em>c'est vous qui choisissez.</em>"
  lead: "Reedly peut retranscrire la conversation en temps réel pendant l'échange, ou permettre au commercial de dicter son compte rendu juste après. Le résultat reste le même : une information structurée, claire et immédiatement exploitable."
  cta_label: "Essayer gratuitement"
  cta_url: "/fr#trial"
problem:
  eyebrow: "Problème"
  title: "Vos commerciaux sont là pour vendre,<br /><em>pas pour prendre des notes.</em>"
  lead: "En rendez-vous, leur attention doit rester sur le client : écouter, comprendre, rebondir, convaincre. Pourtant, chaque échange contient des informations clés qu'il faut pouvoir retrouver ensuite."
  cards:
    - title: "Notes incomplètes et oublis"
      text: "Impossible de tout retenir. Les objections, chiffres clés et engagements client se perdent entre la voiture et le bureau."
      icon: "alert"
    - title: "Concentration divisée"
      text: "Prendre des notes pendant le RDV coupe l'écoute active et brise le rythme de la conversation commerciale."
      icon: "target"
    - title: "Reconstruction approximative"
      text: "Le soir, reconstituer de mémoire ce qui s'est dit 6 heures plus tôt. Résultat : des rapports vagues et inutilisables."
      icon: "shuffle"
benefits:
  cards:
    - title: "100% mains libres"
      text: "Un seul tap pour démarrer. Ensuite, posez votre téléphone et oubliez-le. Reedly suit la conversation en arrière-plan, sans aucune interaction."
      icon: "microphone"
    - title: "Batterie optimisée"
      text: "Pensée pour les tournées : enchaînez 3 heures de rendez-vous consécutifs sans vider votre batterie."
      icon: "zap"
    - title: "Fonctionne hors connexion"
      text: "Zone blanche, sous-sol, campagne : l'app tient sans réseau. La transcription et le compte rendu se génèrent automatiquement au retour de la connexion."
      icon: "globe"
    - title: "La voix n'est jamais conservée"
      text: "Seule la retranscription sert à générer le compte rendu. Aucun fichier vocal n'est stocké. Conformité RGPD garantie."
      icon: "shield"
    - title: "Qualité professionnelle"
      text: "Optimisé pour les environnements bruyants : accueil d'agence, comptoir, plusieurs voix en même temps. Transcription à plus de 95% de précision."
      icon: "chart"
    - title: "Aucune distraction client"
      text: "Pas de dictaphone ni de carnet sur la table. Votre smartphone reste dans votre poche, la relation client reste naturelle."
      icon: "users"
faq:
  - question: "Reedly fonctionne-t-il sans connexion internet ?"
    answer: "Oui. Vous menez votre rendez-vous sans réseau, l'app tient hors ligne. La transcription et le compte rendu font appel à nos modèles IA : ils se génèrent automatiquement dès que la connexion revient."
  - question: "Quelle est l'autonomie batterie sur une tournée complète ?"
    answer: "L'app tient 3 à 4 heures de rendez-vous consécutifs sur une charge standard. Elle est optimisée spécifiquement pour les tournées terrain longues."
  - question: "Dois-je informer mon client que le rendez-vous est retranscrit ?"
    answer: "Oui, le consentement oral est obligatoire en France et en Europe (RGPD). Reedly vous rappelle cette obligation au démarrage de chaque rendez-vous. La plupart des clients acceptent volontiers quand vous expliquez que cela garantit un meilleur suivi."
  - question: "La voix est-elle stockée quelque part après le rendez-vous ?"
    answer: "Non. La voix n'est ni enregistrée ni conservée : elle sert uniquement à produire la retranscription. Seuls le texte retranscrit et le compte rendu sont conservés, jamais de fichier vocal."
  - question: "La transcription tient-elle dans les environnements bruyants ?"
    answer: "Oui. Reedly s'appuie sur des modèles entraînés sur des conditions réelles : accueil d'agence animé, comptoir, plusieurs voix en même temps. Le taux de transcription reste supérieur à 95% même en milieu bruyant."
  - question: "Puis-je mettre en pause pendant le rendez-vous ?"
    answer: "Oui. Vous pouvez mettre en pause et reprendre à tout moment, utile pour les pauses, interruptions ou discussions hors sujet."
