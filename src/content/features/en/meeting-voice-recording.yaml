seo:
  title: "Meeting Voice Recording App for Field Sales | Reedly"
  description: "One-tap meeting voice recording for B2B field sales. Captures client conversations in background, battery-optimized, works offline."
  keywords: ["meeting voice recording app", "client meeting recording", "field sales audio recording"]
hero:
  eyebrow: "Meeting Voice Recording"
  title: "During or after the meeting,<br /><em>it's your call.</em>"
  lead: "Reedly can transcribe the conversation in real time during the meeting, or let the rep dictate the report right afterwards. The result is the same either way: structured, clear information you can act on immediately."
  cta_label: "Start free trial"
  cta_url: "/en#trial"
problem:
  eyebrow: "Problem"
  title: "Your reps are there to sell,<br /><em>not to take notes.</em>"
  lead: "In a meeting, their attention belongs on the client: listening, understanding, responding, convincing. Yet every conversation holds key information that has to be findable afterwards."
  cards:
    - title: "Details lost in translation"
      text: "Client objections, competitor mentions, technical requirements, the crucial details slip away the moment you're back in your car. Mental notes don't cut it when deals depend on accuracy."
      icon: "alert"
    - title: "Note-taking kills rapport"
      text: "Looking down at your notepad or phone during a client meeting breaks eye contact, interrupts flow, and signals you're not fully present. Great salespeople listen. Not type."
      icon: "users"
    - title: "Voice memos pile up"
      text: "Recording quick voice notes after meetings creates a backlog you'll never transcribe. By Friday, you have 12 audio files and zero memory of what was said in which meeting."
      icon: "music"
benefits:
  cards:
    - title: "One-tap operation"
      text: "No settings to adjust, no levels to check. One tap before you walk in, one tap when you leave. That's it."
      icon: "microphone"
    - title: "Runs in the background"
      text: "Lock your phone, check your calendar, reply to a text: Reedly keeps following the conversation. Your phone works normally throughout."
      icon: "layers"
    - title: "Battery optimized"
      text: "Engineered for all-day field use. Run five 1-hour meetings on a single charge without draining your battery."
      icon: "zap"
    - title: "Works completely offline"
      text: "No connection needed during the meeting. Transcription and the report generate automatically as soon as you are back on WiFi or cellular."
      icon: "globe"
    - title: "The voice is never kept"
      text: "Only the transcript is used to generate the structured report. No voice file is stored, at any point."
      icon: "shield"
    - title: "Captures every detail"
      text: "Client objections, competitor mentions, technical specs, pricing discussions: everything is transcribed with 95%+ accuracy for your AI-generated report."
      icon: "target"
faq:
  - question: "Do I have to tell my client the meeting is being transcribed?"
    answer: "Yes. Consent rules vary by location, and in many jurisdictions you need consent from all parties. Reedly reminds you of that obligation at the start of every meeting. Reedly does not provide legal advice, so check your local laws."
  - question: "How long can a single meeting run?"
    answer: "Reedly handles up to 3 hours in one session, which covers virtually all client meetings. For longer ones, simply stop and start a new session."
  - question: "Does Reedly work without an internet connection?"
    answer: "Yes. You run the meeting with no network, the app holds offline. Transcription and the report call our AI models, so they generate automatically as soon as you reconnect to WiFi or cellular data."
  - question: "Is the voice stored anywhere after the meeting?"
    answer: "No. The voice is neither recorded nor stored: it only serves to produce the transcript, with 95%+ accuracy. Only the transcript and the structured report are kept, never a voice file."
  - question: "Does running in the background drain my phone battery?"
    answer: "Reedly is optimized for all-day field use. You can run several 1-hour meetings on a single charge, thanks to battery management designed specifically for mobile sales teams."
  - question: "Does it work on both Android and iOS?"
    answer: "Yes. Reedly works on both iOS and Android devices with identical functionality and battery optimization."
