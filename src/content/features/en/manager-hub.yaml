seo:
  title: "Sales Manager Dashboard & Team Hub | Reedly"
  description: "Manager Hub centralizes every field report from your sales team in one web interface: syntheses, per-member stats, team management."
  keywords:
    - sales manager dashboard
    - commercial director hub
    - field sales team management
hero:
  badge: "Every team report, in real time"
  sticky: "Manager Hub · Every report from your team"
  title: "The sales manager dashboard<br /><em>that centralizes the whole field.</em>"
  lead: "Manager Hub gathers <b>every report from your sales team into a single interface</b>. Strategic syntheses, per-member statistics, centralized management, without opening 15 CRMs or chasing write-ups by email."
problem:
  eyebrow: "Problem"
  title: "Your reps are out in the field.<br /><em>Their information stays invisible.</em>"
  lead: "Sales directors spend their days chasing visit reports, <b>piecing together scattered data</b> and guessing what actually happens at the client's."
  cards:
    - title: "Fragmented, incomplete reporting"
      text: "Write-ups arrive by email, Slack, WhatsApp or not at all. <b>Impossible to consolidate an overall view</b> without losing hours re-typing everything."
      icon: "fragmented"
    - title: "No strategic view of the territory"
      text: "You run 8 reps across 3 regions, but <b>no tool tells you which competitors are gaining ground</b>, which objections keep coming back or which sectors are slowing down."
      icon: "no-vision"
    - title: "Coaching blind"
      text: "Without access to real field conversations, you coach on figures, <b>not on behaviours, arguments or missed opportunities.</b>"
      icon: "blind-coaching"
solution:
  eyebrow: "Solution"
  title: "A hub that centralizes<br /><em>field activity.</em>"
  lead: "Manager Hub automatically gathers the whole team's reports and turns them into a steering view, with no manual data entry at all."
  steps:
    - title: "Your reps run their meetings"
      text: "Every team member uses the Reedly mobile app. Each meeting produces a report structured into 11 sections in under 2 minutes."
    - title: "Reports come up automatically"
      text: "Every write-up appears instantly in your web Manager Hub, sorted by rep, date, client or territory. No manual entry."
    - title: "You steer from one central view"
      text: "A dashboard with team statistics, strategic territory syntheses, member management and report export: everything you need to steer without losing time."
benefits:
  eyebrow: "Benefits"
  title: "The whole field,<br /><em>at a glance.</em>"
  cards:
    - title: "Central dashboard with every report"
      text: "Reach all of your team's write-ups from <b>a single web interface</b>. Filter by rep, date, client or territory in one click."
      icon: "dashboard"
    - title: "Automatic strategic syntheses"
      text: "Reedly automatically aggregates field data: <b>emerging competitors, recurring objections, sector trends.</b> You decide on facts, not impressions."
      icon: "syntheses"
    - title: "Statistics per team member"
      text: "Meetings covered, engagement rate, products discussed most, frequent objections: <b>track performance and coach with qualitative data.</b>"
      icon: "stats"
    - title: "Built-in team management"
      text: "Add or remove members, assign territories, manage permissions, <b>all from the Hub</b>. No external administration."
      icon: "team"
    - title: "Report export and sharing"
      text: "Download individual or consolidated reports <b>as PDF</b>. Share them straight with leadership, marketing or the product team."
      icon: "export"
    - title: "Real-time access from anywhere"
      text: "A web interface reachable from desktop, tablet or mobile. <b>Check field activity on the move</b>, in a meeting or from the office."
      icon: "realtime"
use_cases:
  eyebrow: "Use cases"
  title: "Who uses<br /><em>the Manager Hub?</em>"
  variant: "roles"
  cards:
    - title: "Multi-region sales directors"
      heading: "Multi-region<br />sales directors"
      text: "Steer 5 to 20 reps spread across several territories. Spot in real time the areas that perform, the sectors in difficulty and the priority levers to act on."
      bullets:
        - "Strategic syntheses by territory"
        - "Areas that perform, sectors that slow down"
        - "Priority levers to act on"
    - title: "Sales managers coaching teams"
      heading: "Sales managers<br />coaching teams"
      text: "Reach your reps' reports before the weekly debriefs. Prepare your one-to-ones with concrete examples drawn from real client conversations."
      bullets:
        - "Reports by rep and by period"
        - "Recurring objections from the field"
        - "Debriefs prepared on real cases"
    - title: "Key account managers"
      heading: "Key account<br />managers"
      text: "Follow every interaction with your strategic accounts, even when several reps are involved. Keep a 360° view of the client relationship."
      bullets:
        - "Full account history"
        - "Every rep who has been involved"
        - "Report export and sharing"
    - title: "Executive teams in SMEs"
      heading: "Executive teams<br />in SMEs"
      text: "Check sales activity without going through incomplete weekly reports. A clear, immediate view of what is being said in the field."
      bullets:
        - "Consolidated sales activity"
        - "Field trends, week after week"
        - "No reporting to chase"
faq:
  - question: "How do reports reach the Manager Hub?"
    answer: "Every time a rep generates a report through the Reedly mobile app, it appears automatically in the Manager Hub. No manual sync, everything is real time."
  - question: "Can I manage access permissions per member?"
    answer: "Yes. You control who sees what: some members can view only their own reports, others reach the whole team. You manage the roles from the Hub."
  - question: "Is the Manager Hub included in the Reedly subscription?"
    answer: "The Manager Hub is available from the Team plan. Reps use the mobile app, managers reach the web Hub on the same subscription, at no extra cost."
  - question: "Can data be exported into the CRM?"
    answer: "Yes. You can download individual or consolidated reports as PDF, or use our API to connect Reedly to your CRM (Salesforce, HubSpot, Pipedrive…)."
  - question: "Do reps see that I am reading their reports?"
    answer: "No. The Manager Hub is a reading interface for managers. Reps get no notification when you open their write-ups."
  - question: "How long are reports kept in the Hub?"
    answer: "Every report is kept indefinitely in your Manager Hub. You can browse the full history of field activity from the start of your subscription."
