seo:
  title: "AI Transcription for Sales Meetings | Reedly"
  description: "Automatic transcription of your client meetings with 95%+ accuracy. Handles accents, industry vocabulary and noisy environments."
  keywords:
    - automatic meeting transcription
    - AI business meeting transcription
    - professional voice transcription
hero:
  badge: "Transcription during or after the meeting"
  sticky: "AI Transcription · 95%+ accuracy"
  title: "AI transcription of the sales meeting<br /><em>in real time.</em>"
  lead: "Reedly automatically transcribes your client conversations with over 95% accuracy. The AI engine understands regional accents and your industry's technical vocabulary, and works even in noisy environments."
problem:
  eyebrow: "Problem"
  title: "Transcribing by hand<br /><em>loses what matters.</em>"
  lead: "Taking notes in the middle of a meeting cuts you off from the conversation. Relying on memory to write it up afterwards means <b>losing 60% of the crucial detail</b>: exact figures, objections as they were phrased, mutual commitments."
  cards:
    - title: "You cannot listen and take notes at once"
      text: "While you scribble notes, <b>you miss the weak signals, the unsaid, the objections barely voiced.</b> Your attention is split at the worst possible moment."
      icon: "no-notes"
    - title: "Memory distorts the facts"
      text: "By the evening it is impossible to recall exactly who said what. <b>Figures blur together, commitments become vague, objections fade away.</b>"
      icon: "memory"
    - title: "Generic tools fail in the field"
      text: "Generic transcription understands neither industry terms, nor accents, nor the background noise of a workshop or a building site."
      icon: "generic-tools"
solution:
  eyebrow: "Solution"
  title: "AI transcription<br /><em>that understands your trade.</em>"
  lead: "Reedly automatically transcribes every meeting with over 95% accuracy, using specialised AI models (Deepgram and Voxtral) trained for the B2B sales context."
  steps:
    - title: "Recording in the background"
      text: "The app follows the conversation while you stay focused on the exchange. Nothing to watch, nothing to handle during the meeting."
    - title: "Real-time AI transcription"
      text: "The AI engine transcribes the conversation as it happens, identifies the speakers, understands sector vocabulary and filters out background noise."
    - title: "Full text ready to use"
      text: "You get a complete, timestamped transcript with speaker identification. The perfect basis for the structured report generated next."
benefits:
  eyebrow: "Benefits"
  title: "Why Reedly<br /><em>makes the difference.</em>"
  cards:
    - title: "95%+ accuracy, guaranteed"
      text: "AI models optimised for spoken French and the sales context. <b>An accuracy rate above generalist tools.</b>"
      icon: "accuracy"
    - title: "Understands accents and industry jargon"
      text: "Transcription adapts to regional accents, to <b>your sector's technical vocabulary</b> (industry, healthcare, construction, retail) and to trade acronyms."
      icon: "jargon"
    - title: "Works in noisy environments"
      text: "<b>Audio filtering algorithms capture the voice</b> even in a workshop, on a building site, in a warehouse or in a busy point of sale."
      icon: "noise"
    - title: "Automatic speaker identification"
      text: "The AI engine <b>tells the voices apart and identifies who is speaking</b> at any moment. Ideal for meetings with several people on the client side."
      icon: "speakers"
    - title: "Secure, confidential transcription"
      text: "Transcripts and reports encrypted end to end. <b>Hosted in Europe, GDPR compliant</b>. Your client conversations stay strictly confidential."
      icon: "secure"
    - title: "The basis of the AI structured report"
      text: "The transcript feeds straight into the <b>generation of the 11-section report</b>. You go from conversation to structured write-up <b>in under 2 minutes.</b>"
      icon: "report"
use_cases:
  eyebrow: "Use cases"
  title: "Who uses it<br /><em>day to day?</em>"
  cards:
    - title: "Field reps across several sectors"
      text: "Every client has their own vocabulary, acronyms and technical specifics. AI transcription <b>adapts to each context and keeps the exchange faithful.</b>"
    - title: "Sales teams in industrial settings"
      text: "<b>Meetings in a workshop, on site, in a warehouse</b>: background noise does not disturb the transcription. The AI filters the noise and captures what matters."
    - title: "Sales managers and directors"
      text: "Access the full transcript of every meeting through <b>the web Hub</b>. Ideal for <b>coaching</b>, working through objections and <b>bringing the team up to speed</b>."
    - title: "Reps in complex discovery"
      text: "<b>Long meetings, several stakeholders,</b> with sharp technical questions. The transcript <b>captures every detail so you can refine the needs analysis</b> afterwards."
faq:
  - question: "How accurate is Reedly's AI transcription in practice?"
    answer: "Reedly guarantees over 95% accuracy thanks to the Deepgram and Voxtral AI models, specifically optimised for spoken French in a B2B sales context. That accuracy holds up with regional accents and sector-specific technical vocabulary."
  - question: "Does transcription work in a noisy environment?"
    answer: "Yes. Reedly's audio filtering algorithms are designed to capture the voice in noisy environments: workshop, building site, warehouse, point of sale. The AI engine isolates speech and reduces background noise to keep the transcript usable."
  - question: "Does the AI transcription understand my sector's vocabulary?"
    answer: "Yes. Reedly's AI models are trained on B2B sales vocabulary across sectors. They recognise technical terms and trade acronyms, and adapt to your industry's context (industry, healthcare, construction, retail, services)."
  - question: "What happens to transcripts after the meeting?"
    answer: "Transcripts are encrypted end to end and stored securely on servers in Europe, in line with the GDPR. Only you and your team (if shared) have access. You can delete a transcript at any time from the app."
  - question: "Does transcription identify the speakers automatically?"
    answer: "Yes. Reedly's AI engine tells the voices apart and automatically identifies the different speakers during the meeting. Ideal for meetings with several people on the client side, where it matters who expressed which need or objection."
  - question: "Can I correct the transcript if it contains mistakes?"
    answer: "Yes. You can review and correct the transcript from the mobile app or the web Hub. Any correction also improves the final structured report, which uses the transcript as its working basis."
