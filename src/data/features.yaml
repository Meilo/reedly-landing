# Central registry mapping feature IDs to FR/EN slug pairs.
# Each entry produces two pages: /fr/features/{slugFr} and /en/features/{slugEn}

features:
  - id: "ai-transcription"
    slugs:
      fr: "transcription-ia"
      en: "ai-transcription"

  - id: "manager-hub"
    slugs:
      fr: "hub-manager"
      en: "manager-hub"
